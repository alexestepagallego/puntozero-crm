<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#0a0a0a">
    <title>PuntoZero · CRM</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/app.css">
    <link rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230a0a0a'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23fff'/%3E%3C/svg%3E">

    <!-- Animación de entrada: mismo logo y misma línea de tiempo que puntozerosl.es.
         Los estilos van aquí, en línea, para que la cortina esté pintada antes de
         que llegue la hoja de estilos y no se vea el CRM a medio montar. -->
    <style>
        #pz-loader {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: grid;
            place-items: center;
            background: #0a0a0a;
            will-change: transform;
        }

        #pz-loader .pz-stage {
            position: relative;
            display: grid;
            place-items: center;
            width: min(56vw, 40vh, 300px);
            aspect-ratio: 1 / 1;
        }

        #pz-loader .pz-glow {
            position: absolute;
            inset: -35%;
            border-radius: 50%;
            opacity: 0;
            pointer-events: none;
            background: radial-gradient(circle,
                rgba(255, 255, 255, .40) 0%,
                rgba(255, 255, 255, .10) 38%,
                transparent 68%);
        }

        #pz-logo {
            position: relative;
            width: 100%;
            height: auto;
            color: #fff;
            overflow: visible;
            /* Lo destapa GSAP al montar la línea de tiempo: así no se ve el
               logo entero antes de empezar a dibujarse. */
            visibility: hidden;
        }

        /* Con "reducir movimiento" el logo se ve quieto, sin dibujarse. */
        .pz-quieto #pz-logo { visibility: visible; }

        #pz-loader.pz-fuera { opacity: 0; transition: opacity .35s ease; }

        /* Mientras la cortina está puesta no se puede hacer scroll por detrás. */
        .pz-cargando, .pz-cargando body { overflow: hidden; }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.15.0/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.15.0/DrawSVGPlugin.min.js"></script>
</head>

<body>

    <div id="pz-loader" role="presentation">
        <div class="pz-stage">
            <div class="pz-glow"></div>
            <svg id="pz-logo" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
              <defs>
                <!-- En el logo original los huecos del donut de origen y del nodo
                     central están calados también a través de la flecha. Sin esta
                     máscara el trazo de la flecha los taparía. -->
                <mask id="pz-huecos">
                  <rect width="240" height="240" fill="#fff"/>
                  <circle cx="62.15" cy="182.3" r="9.5" fill="#000"/>
                  <circle cx="172.47" cy="63.67" r="7" fill="#000"/>
                </mask>
              </defs>
              <g fill="none" stroke="currentColor" stroke-width="14.0">
                <path class="pz-ring" d="M56.42 170.02A80.9 80.9 0 0 1 165.28 52.96"/>
                <path class="pz-ring" d="M74.72 187.04A80.9 80.9 0 0 0 183.58 69.98"/>
                <path class="pz-oval" d="M73.96 151.15A51.1 71.8 0 0 1 153.43 65.7"/>
                <path class="pz-oval" d="M86.57 174.3A51.1 71.8 0 0 0 166.04 88.85"/>
                <path class="pz-shaft" stroke-width="14.4" mask="url(#pz-huecos)" d="M62.15 182.3L190.17 44.63"/>
                <circle class="pz-origin" cx="62.15" cy="182.3" r="14.75" stroke-width="10.5"/>
                <circle class="pz-hub" cx="172.47" cy="63.67" r="10.5" stroke-width="7"/>
                <circle class="pz-node" cx="120.0" cy="33.9" r="5.5" stroke-width="4.6"/>
                <circle class="pz-node" cx="33.9" cy="120.0" r="5.5" stroke-width="4.6"/>
                <circle class="pz-node" cx="206.1" cy="120.0" r="5.5" stroke-width="4.6"/>
                <circle class="pz-node" cx="120.0" cy="206.1" r="5.5" stroke-width="4.6"/>
                <circle class="pz-node" cx="68.9" cy="120.0" r="6.1" stroke-width="5.8"/>
                <circle class="pz-node" cx="171.1" cy="120.0" r="6.1" stroke-width="5.8"/>
              </g>
              <polygon class="pz-head" fill="currentColor" points="208.7,24.71 203.36,56.88 176.99,32.37"/>
            </svg>
        </div>
    </div>

    <noscript>
        <!-- Sin JavaScript nadie va a quitar la cortina: mejor no ponerla. -->
        <style>#pz-loader { display: none; }</style>
    </noscript>

    <script>
        (function () {
            document.documentElement.classList.add('pz-cargando');
            // Red de seguridad por si js/loader.js no llega a cargar (404, red
            // caída): sin esto la cortina taparía el CRM para siempre. El tope
            // propio del loader es de 6 s, así que esto solo salta si no está.
            window.setTimeout(function () {
                var l = document.getElementById('pz-loader');
                if (l && l.parentNode) l.parentNode.removeChild(l);
                document.documentElement.classList.remove('pz-cargando');
            }, 7000);
        })();
    </script>
    <script src="js/loader.js"></script>

    <div id="app">
        <div class="auth-wrap">
            <div class="auth-box center">
                <div class="brand"><span class="brand-dot"></span><span class="brand-name">PuntoZero</span></div>
                <p class="muted small mt">Cargando el CRM…</p>
            </div>
        </div>
    </div>

    <div class="scrim" id="scrim"></div>
    <div class="toasts" id="toasts"></div>

    <noscript>
        <div class="auth-wrap">
            <div class="auth-box center">
                <h2>Necesitas JavaScript</h2>
                <p class="muted small mt">Este CRM funciona en el navegador. Activa JavaScript para entrar.</p>
            </div>
        </div>
    </noscript>

    <script type="module" src="js/main.js"></script>
</body>

</html>
