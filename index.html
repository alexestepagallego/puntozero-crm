<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#0a0a0a">
    <title>PuntoZero · CRM</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/app.css">
    <link rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230a0a0a'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23fff'/%3E%3C/svg%3E">
</head>

<body>
    <div id="app">
        <div class="auth-wrap">
            <div class="auth-box center">
                <div class="brand"><span class="brand-dot"></span><span class="brand-name">PuntoZero</span></div>
                <p class="muted small mt">Cargando el CRM…</p>
            </div>
        </div>
    </div>

    <div class="scrim" id="scrim"></div>
    <div class="toasts" id="toasts"></div>

    <noscript>
        <div class="auth-wrap">
            <div class="auth-box center">
                <h2>Necesitas JavaScript</h2>
                <p class="muted small mt">Este CRM funciona en el navegador. Activa JavaScript para entrar.</p>
            </div>
        </div>
    </noscript>

    <script type="module" src="js/main.js"></script>
</body>

</html>
